<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>河內塔五關挑戰｜手機橫向版</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--line:#dfe5ec;--primary:#2563eb;--primary-soft:#eff6ff;--good:#15803d;--good-soft:#ecfdf3;--warn:#a16207;--warn-soft:#fff7df;--bad:#b42318;--bad-soft:#fef3f2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
body{font-size:15px;line-height:1.4;min-height:100vh}
button,input,select{font:inherit} button{touch-action:manipulation}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.header-inner{max-width:980px;margin:auto;padding:7px 10px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-size:18px;font-weight:900}
.score-chip{background:var(--primary-soft);color:var(--primary);padding:4px 9px;border-radius:999px;font-size:13px;font-weight:900}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.level-dot{height:6px;border-radius:999px;background:#e7ebf1}.level-dot.current{background:var(--primary)}.level-dot.done{background:var(--good)}
main{max-width:980px;margin:auto;padding:8px 8px 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 4px 16px rgba(15,23,42,.04)}
h2{font-size:21px;margin:0 0 6px}.lead{font-size:16px;color:#344054;margin:5px 0 10px}
.form-grid{display:grid;grid-template-columns:1fr 180px;gap:10px;align-items:end}.form-row{display:grid;gap:5px}
label{font-weight:800}
input,select{width:100%;min-height:42px;padding:8px 10px;border:1px solid #cfd6e0;border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:9px 13px;min-height:42px;font-weight:900;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.btn.secondary{background:#edf1f6;color:#344054}.btn.good{background:var(--good);color:#fff}.btn:disabled{opacity:.45}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.notice{padding:8px 10px;border-radius:9px;margin:8px 0}.notice.info{background:var(--primary-soft);color:#1d4ed8}.notice.good{background:var(--good-soft);color:#166534}.notice.warn{background:var(--warn-soft);color:#8a5a00}.notice.bad{background:var(--bad-soft);color:#991b1b}
.statusbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:7px 0}.status{border:1px solid var(--line);border-radius:9px;padding:6px 5px;text-align:center;background:#fff}.status span{display:block;font-size:11px;color:var(--muted)}.status b{display:block;font-size:17px;line-height:1.2}
.game{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-items:end;margin-top:7px}
.tower{position:relative;min-width:0;height:230px;border:2px solid var(--line);border-radius:12px;background:linear-gradient(#fff,#f8fafc);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:12px 4px 18px;cursor:pointer;overflow:hidden}
.tower.selected{border-color:var(--primary);background:var(--primary-soft)}.tower:focus{outline:3px solid rgba(37,99,235,.25);outline-offset:1px}
.tower-label{position:absolute;top:5px;left:0;right:0;text-align:center;font-weight:900;font-size:15px;color:#475467;z-index:3}
.peg{position:absolute;bottom:18px;width:7px;height:165px;background:#8f98a6;border-radius:7px 7px 0 0;z-index:1}
.base{position:absolute;bottom:10px;width:88%;height:8px;border-radius:999px;background:#707987;z-index:1}
.disks{position:relative;z-index:2;width:100%;display:flex;flex-direction:column-reverse;align-items:center}
.disk{height:24px;border-radius:999px;margin-top:2px;border:2px solid rgba(0,0,0,.1);background:#dbe6f8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#172033}
.disk[data-size="1"]{width:30%}.disk[data-size="2"]{width:40%}.disk[data-size="3"]{width:50%}.disk[data-size="4"]{width:60%}.disk[data-size="5"]{width:70%}.disk[data-size="6"]{width:80%}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:5px}
.result{text-align:center;padding:8px 0}.big-score{font-size:44px;font-weight:1000;color:var(--primary);line-height:1.05;margin:8px 0}
.summary-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.summary-table th,.summary-table td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:center}.summary-table th{background:#f8fafc}
.hidden{display:none!important}
#rotateHint{display:none;border:1px solid #f2d191;background:var(--warn-soft);color:#805400;border-radius:10px;padding:10px;margin-bottom:8px;text-align:center;font-weight:800}
@media (orientation:portrait) and (max-width:700px){#rotateHint{display:block}.game{grid-template-columns:repeat(3,1fr)}.tower{height:185px}.peg{height:125px}.disk{height:19px;font-size:9px}.form-grid{grid-template-columns:1fr}}
@media (orientation:landscape) and (max-height:500px){body{font-size:13px}.header-inner{padding:4px 8px}.title{font-size:16px}main{padding-top:5px}.card{padding:8px}h2{font-size:18px}.lead{font-size:14px;margin-bottom:6px}.statusbar{margin:4px 0}.status{padding:4px}.status b{font-size:15px}.game{margin-top:4px}.tower{height:190px}.peg{height:135px}.disk{height:20px;font-size:9px}.notice{margin:5px 0;padding:6px 8px}.actions{margin-top:6px}.btn{min-height:38px;padding:7px 11px}}
@media (orientation:landscape) and (max-height:390px){.tower{height:165px}.peg{height:112px}.disk{height:17px}.status span{font-size:10px}.status b{font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="toprow">
      <div class="title">河內塔五關挑戰</div>
      <div class="score-chip" id="scoreChip">目前成績：0 / 100 分</div>
    </div>
    <div class="progress" id="progress"></div>
  </div>
</header>

<main>
  <div id="rotateHint">📱 建議將手機轉成橫向，三根柱子會更清楚、更好操作。</div>

  <section class="card" id="setupScreen">
    <h2>開始挑戰</h2>
    <p class="lead">共 5 關，每完成一關得 20 分，滿分 80 分。</p>
    <div class="form-grid">
      <div class="form-row">
        <label for="studentName">學生姓名</label>
        <input id="studentName" type="text" maxlength="30" placeholder="請輸入姓名">
      </div>
      <button class="btn primary" id="startBtn">開始第 1 關</button>
    </div>
    <div class="notice info">操作方式：先點「來源柱」，再點「目的柱」。大圓盤不能放在小圓盤上。</div>
  </section>

  <section class="card hidden" id="gameScreen">
    <h2 id="levelTitle">第 1 關</h2>
    <div id="levelSetup">
      <div class="form-grid">
        <div class="form-row">
          <label>本關圓盤數量</label>
          <div id="fixedDiskDisplay" style="min-height:42px;padding:9px 10px;border:1px solid #cfd6e0;border-radius:10px;background:#f8fafc;font-weight:900"></div>
        </div>
        <button class="btn primary" id="startLevelBtn">開始本關</button>
      </div>
      <div class="notice info" id="recommendText"></div>
    </div>

    <div id="playingArea" class="hidden">
      <div class="statusbar">
        <div class="status"><span>學生</span><b id="studentLabel">—</b></div>
        <div class="status"><span>關卡</span><b id="levelLabel">1 / 5</b></div>
        <div class="status"><span>移動</span><b id="moveCount">0</b></div>
        <div class="status"><span>最佳步數</span><b id="optimalCount">7</b></div>
      </div>
      <div id="message" class="notice info">先點來源柱，再點目的柱。</div>

      <div class="game">
        <button class="tower" type="button" data-tower="0" aria-label="A 柱">
          <div class="tower-label">A</div><div class="peg"></div><div class="base"></div><div class="disks"></div>
        </button>
        <button class="tower" type="button" data-tower="1" aria-label="B 柱">
          <div class="tower-label">B</div><div class="peg"></div><div class="base"></div><div class="disks"></div>
        </button>
        <button class="tower" type="button" data-tower="2" aria-label="C 柱">
          <div class="tower-label">C</div><div class="peg"></div><div class="base"></div><div class="disks"></div>
        </button>
      </div>

      <div class="hint">目標：把所有圓盤從 A 柱移到 C 柱。</div>
      <div class="actions">
        <button class="btn secondary" id="restartLevelBtn">本關重來</button>
        <button class="btn primary" id="finishNowBtn">結束挑戰／查看目前成績</button>
      </div>
    </div>
  </section>

  <section class="card hidden" id="completeScreen">
    <div class="result">
      <h2 id="resultTitle">目前挑戰成績</h2>
      <div class="lead">學生姓名：<strong id="finalName"></strong></div>
      <div class="big-score" id="finalScore">100 / 100</div>
      <div id="finalMessage" class="notice good"></div>
      <div id="completionNote" class="notice info"></div>

      <table class="summary-table">
        <thead><tr><th>關卡</th><th>圓盤</th><th>移動次數</th><th>得分</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>

      <div class="actions" style="justify-content:center">
        <button class="btn primary" id="playAgainBtn">重新開始</button>
      </div>
    </div>
  </section>
</main>

<script>
const TOTAL_LEVELS=5, POINTS_PER_LEVEL=20;
const recommendedDisks=[1,2,3,4,5];

let state={name:"",level:1,score:0,diskCount:3,towers:[[],[],[]],selected:null,moves:0,completed:[]};

const setupScreen=document.getElementById("setupScreen");
const gameScreen=document.getElementById("gameScreen");
const completeScreen=document.getElementById("completeScreen");
const studentName=document.getElementById("studentName");
const startBtn=document.getElementById("startBtn");
const startLevelBtn=document.getElementById("startLevelBtn");
const fixedDiskDisplay=document.getElementById("fixedDiskDisplay");
const levelSetup=document.getElementById("levelSetup");
const playingArea=document.getElementById("playingArea");
const levelTitle=document.getElementById("levelTitle");
const recommendText=document.getElementById("recommendText");
const scoreChip=document.getElementById("scoreChip");
const progress=document.getElementById("progress");
const message=document.getElementById("message");
const moveCount=document.getElementById("moveCount");
const optimalCount=document.getElementById("optimalCount");
const studentLabel=document.getElementById("studentLabel");
const levelLabel=document.getElementById("levelLabel");
const restartLevelBtn=document.getElementById("restartLevelBtn");
const finishNowBtn=document.getElementById("finishNowBtn");
const towerButtons=[...document.querySelectorAll(".tower")];

function renderProgress(){
  progress.innerHTML="";
  for(let i=1;i<=TOTAL_LEVELS;i++){
    const d=document.createElement("div");
    d.className="level-dot";
    if(i<state.level || state.completed.length>=i)d.classList.add("done");
    else if(i===state.level)d.classList.add("current");
    progress.appendChild(d);
  }
  scoreChip.textContent=`目前成績：${state.score} / ${TOTAL_LEVELS*POINTS_PER_LEVEL} 分`;
}

function showLevelSetup(){
  setupScreen.classList.add("hidden");
  completeScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  playingArea.classList.add("hidden");
  levelSetup.classList.remove("hidden");

  levelTitle.textContent=`第 ${state.level} 關`;
  const rec=recommendedDisks[state.level-1];
  fixedDiskDisplay.textContent=`${rec} 個圓盤`;
  recommendText.textContent=`第 ${state.level} 關固定使用 ${rec} 個圓盤。`;
  renderProgress();
}

function startLevel(){
  state.diskCount=recommendedDisks[state.level-1];
  state.towers=[[],[],[]];
  for(let size=state.diskCount;size>=1;size--)state.towers[0].push(size);
  state.selected=null;
  state.moves=0;

  levelSetup.classList.add("hidden");
  playingArea.classList.remove("hidden");
  studentLabel.textContent=state.name;
  levelLabel.textContent=`${state.level} / ${TOTAL_LEVELS}`;
  optimalCount.textContent=String(Math.pow(2,state.diskCount)-1);
  moveCount.textContent="0";
  setMessage("先點來源柱，再點目的柱。","info");
  renderGame();
}

function renderGame(){
  towerButtons.forEach((btn,index)=>{
    btn.classList.toggle("selected",state.selected===index);
    const disks=btn.querySelector(".disks");
    disks.innerHTML="";
    state.towers[index].forEach(size=>{
      const d=document.createElement("div");
      d.className="disk";
      d.dataset.size=String(size);
      d.textContent=String(size);
      disks.appendChild(d);
    });
  });
  moveCount.textContent=String(state.moves);
}

function setMessage(text,type="info"){
  message.className=`notice ${type}`;
  message.textContent=text;
}

function topDisk(index){
  const t=state.towers[index];
  return t.length?t[t.length-1]:null;
}

function handleTowerClick(index){
  if(playingArea.classList.contains("hidden"))return;

  if(state.selected===null){
    if(!state.towers[index].length){
      setMessage("這根柱子沒有圓盤，請選另一根。","warn");
      return;
    }
    state.selected=index;
    setMessage(`已選擇 ${["A","B","C"][index]} 柱，請再點目的柱。`,"info");
    renderGame();
    return;
  }

  if(index===state.selected){
    state.selected=null;
    setMessage("已取消選擇。","info");
    renderGame();
    return;
  }

  const from=state.selected;
  const moving=topDisk(from);
  const targetTop=topDisk(index);

  if(targetTop!==null && moving>targetTop){
    state.selected=null;
    setMessage("不能把大圓盤放在小圓盤上。","bad");
    renderGame();
    return;
  }

  state.towers[from].pop();
  state.towers[index].push(moving);
  state.moves++;
  state.selected=null;
  renderGame();

  if(state.towers[2].length===state.diskCount)completeLevel();
  else setMessage("移動成功。","good");
}

function completeLevel(){
  state.completed.push({level:state.level,disks:state.diskCount,moves:state.moves,score:POINTS_PER_LEVEL});
  state.score+=POINTS_PER_LEVEL;
  renderProgress();
  setMessage(`第 ${state.level} 關完成！立即加 ${POINTS_PER_LEVEL} 分，目前總分 ${state.score} 分。`,"good");

  const old=playingArea.querySelector(".level-next-actions");
  if(old)old.remove();

  const wrap=document.createElement("div");
  wrap.className="actions level-next-actions";
  const btn=document.createElement("button");
  btn.className="btn good";
  btn.type="button";
  btn.textContent=state.level===TOTAL_LEVELS?"查看總成績":`進入第 ${state.level+1} 關`;
  btn.addEventListener("click",()=>{
    if(state.level===TOTAL_LEVELS)showFinal();
    else{state.level++;showLevelSetup();}
  });
  wrap.appendChild(btn);
  playingArea.appendChild(wrap);
}

function showFinal(){
  gameScreen.classList.add("hidden");
  setupScreen.classList.add("hidden");
  completeScreen.classList.remove("hidden");

  const fullScore=TOTAL_LEVELS*POINTS_PER_LEVEL;
  const finishedAll=state.completed.length===TOTAL_LEVELS;
  const percent=Math.round((state.score/fullScore)*100);

  document.getElementById("resultTitle").textContent=
    finishedAll ? "五關挑戰完成" : "目前挑戰成績";
  document.getElementById("finalName").textContent=state.name;
  document.getElementById("finalScore").textContent=`${state.score} / ${fullScore}`;
  document.getElementById("finalMessage").textContent=
    `已完成 ${state.completed.length} / ${TOTAL_LEVELS} 關，目前獲得 ${state.score} 分。`;
  document.getElementById("completionNote").textContent=
    finishedAll
      ? `全部完成！換算完成率為 ${percent}%。`
      : `尚未全部完成，但已完成關卡的分數會保留。換算完成率為 ${percent}%。`;

  const body=document.getElementById("summaryBody");
  if(state.completed.length){
    body.innerHTML=state.completed.map(r=>`
      <tr><td>第 ${r.level} 關</td><td>${r.disks} 個</td><td>${r.moves}</td><td>${r.score}</td></tr>
    `).join("");
  }else{
    body.innerHTML='<tr><td colspan="4">目前尚未完成任何關卡，得分 0 分。</td></tr>';
  }
}

function resetAll(){
  state={name:"",level:1,score:0,diskCount:3,towers:[[],[],[]],selected:null,moves:0,completed:[]};
  studentName.value="";
  setupScreen.classList.remove("hidden");
  gameScreen.classList.add("hidden");
  completeScreen.classList.add("hidden");
  renderProgress();
}

startBtn.addEventListener("click",()=>{
  const name=studentName.value.trim();
  if(!name){alert("請先輸入學生姓名。");studentName.focus();return;}
  state.name=name;
  showLevelSetup();
});
startLevelBtn.addEventListener("click",startLevel);
restartLevelBtn.addEventListener("click",startLevel);
finishNowBtn.addEventListener("click",()=>{
  if(confirm(`目前已完成 ${state.completed.length} 關，得分 ${state.score} / ${TOTAL_LEVELS*POINTS_PER_LEVEL}。要查看目前成績嗎？`)){
    showFinal();
  }
});
towerButtons.forEach((btn,i)=>btn.addEventListener("click",()=>handleTowerClick(i)));
document.getElementById("playAgainBtn").addEventListener("click",resetAll);

renderProgress();
</script>
</body>
</html>
